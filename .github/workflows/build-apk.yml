name: Build Android APK

on:
  push:
    branches:
      - main  # Change to 'master' if your default branch uses that name

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up Java Development Kit (JDK) needed for Android builds
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Step 3: Set up the Flutter SDK environment
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # Step 4: Fetch dependencies
      - name: Install Dependencies
        run: flutter pub get

      # Step 5: Compile the application into a release APK
      - name: Build APK
        run: flutter build apk --release

      # Step 6: Make the completed APK file downloadable on GitHub
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
